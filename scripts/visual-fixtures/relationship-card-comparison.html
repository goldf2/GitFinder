<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>关系卡片浏览器渲染对比</title>
<style>
  body { margin: 24px; color: #17202c; background: #edf2f7; font: 14px system-ui; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 20px; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  iframe { width: 100%; height: 1080px; border: 1px solid #ccd4df; background: #fff; }
  output { white-space: pre-wrap; }
</style>
<header><h1>原型与正式渲染器对比</h1><label>卡片比例 <select id="scale"><option>1</option><option>1.35</option><option>0.8</option></select></label><button id="theme">切换明暗</button><button id="details">切换详情</button><button id="compare">重新比较</button></header>
<p>使用同一组测试文案，不读取本机项目、令牌或部署数据。左侧直接使用批准的原型，右侧使用正式卡片渲染器及应用完整样式表。</p>
<output id="result">正在比较…</output>
<details><summary>差异明细</summary><pre id="differences"></pre></details>
<main><section><h2>批准的原型</h2><iframe id="reference" src="../../prototypes/relationship-card-overview/"></iframe></section><section><h2>正式白板组件</h2><iframe id="production" src="relationship-card-production.html"></iframe></section></main>
<script src="relationship-card-comparison.js"></script>
</html>
